<!doctype html><meta charset=utf-8><title>C Raking light</title>
<style>body{margin:0;background:#111}canvas{display:block;width:100vw;height:100vh}</style><canvas id=g></canvas>
<script>
const cv=document.getElementById('g'),gl=cv.getContext('webgl2');const W=cv.width=innerWidth,H=cv.height=innerHeight;
const t=document.createElement('canvas');t.width=W;t.height=H;const x=t.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,W,H);x.filter='blur(3px)';x.fillStyle='#fff';x.font='italic 220px Georgia';x.textAlign='center';x.textBaseline='middle';x.fillText('Shityalkar',W/2,H/2);
const vs=`#version 300 es
in vec2 p;out vec2 uv;void main(){uv=p*.5+.5;uv.y=1.-uv.y;gl_Position=vec4(p,0,1);}`;
const fs=`#version 300 es
precision highp float;in vec2 uv;out vec4 o;uniform sampler2D h;uniform vec2 L;uniform vec2 r;
void main(){vec2 e=1./r;float a=texture(h,uv+vec2(e.x,0)).r-texture(h,uv-vec2(e.x,0)).r;float b=texture(h,uv+vec2(0,e.y)).r-texture(h,uv-vec2(0,e.y)).r;
vec3 n=normalize(vec3(-a*6.,-b*6.,1.));vec3 l=normalize(vec3(L-uv,.25));float d=max(dot(n,l),0.);float day=clamp(L.y*-1.+1.,0.,1.);
vec3 paper=mix(vec3(.07,.065,.06),vec3(.96,.95,.92),day);o=vec4(paper*(.55+.6*d),1);}`;
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o}const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);gl.useProgram(p);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,t);
let L=[.2,.2];onpointermove=e=>{L=[e.clientX/W,e.clientY/H]};(function f(){gl.uniform2f(gl.getUniformLocation(p,'L'),L[0],L[1]);gl.uniform2f(gl.getUniformLocation(p,'r'),W,H);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(f)})();
</script>
